name: Angel-of-Dev
on:
  workflow_dispatch:
  pull_request:
    branches: [ website/main ]
  push:
    branches: [ website/main ]

jobs:
  visual-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Tools/AmenDVisualAnalysis/Requirements.txt
      - name: Install AMEN.D analyzer requirements
        run: python -m pip install -r Tools/AmenDVisualAnalysis/Requirements.txt
      - name: Run AMEN.D visual analysis
        run: npm run AmenD:Analyze
      - name: Publish AMEN.D SARIF
        if: always() && hashFiles('.data/AmenDVisualAnalysis/AmenD.VisualAnalysis.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: .data/AmenDVisualAnalysis/AmenD.VisualAnalysis.sarif
          category: AmenD.VisualAnalysis

  build:
    needs: visual-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx nuxt build --preset github_pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github_pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
